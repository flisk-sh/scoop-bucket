name: Update and test the manifest

# Each release of flisk-sh/releases is picked up here, tested on Windows,
# and only then pushed. No token from another repository is needed.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: update-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.write.outputs.changed }}
      version: ${{ steps.write.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Write the manifest for the latest release
        id: write
        run: |
          version="$(bash scripts/update-manifest.sh)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if git diff --quiet -- bucket/flisk.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest
          path: bucket/flisk.json
          if-no-files-found: error

  test:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifest
          path: bucket
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install Scoop
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
          Invoke-RestMethod get.scoop.sh -OutFile $installer
          & $installer -RunAsAdmin
          Join-Path $env:USERPROFILE 'scoop\shims' >> $env:GITHUB_PATH
      - name: Add this checkout as a bucket
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/flisk.json
          git commit -m "candidate" --allow-empty
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global --add safe.directory '*'
          # Scoop only accepts a Git URL, not a plain path.
          scoop bucket add flisk "file:///$($env:GITHUB_WORKSPACE -replace '\\', '/')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install
        run: |
          scoop install flisk/flisk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the installed CLI and find its engine
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          $output = flisk --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("$output" -notmatch [regex]::Escape($env:VERSION)) { throw "wrong version: $output" }
          Get-Command flisk | Format-List Source
          $project = Join-Path $env:RUNNER_TEMP 'flisk-project'
          New-Item -ItemType Directory -Path $project | Out-Null
          Set-Location $project
          flisk project --yes --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Copied from flisk-cli, which the binary finds next to its own path.
          if (-not (Test-Path 'shared-platform-engineering\docker-templates\install-deps.sh')) {
            throw 'the installed binary did not find flisk-cli'
          }

  publish:
    needs: [candidate, test]
    if: needs.candidate.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifest
          path: bucket
      - name: Push the tested manifest
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/flisk.json
          git commit -s -m "flisk $VERSION"
          git push
