name: Update and test the manifest

# Release notifications and the scheduled fallback share the same tested
# manifest update path. Publishing uses a token so GEL checks run on the PR.
on:
  schedule:
    - cron: "37 * * * *"
  repository_dispatch:
    types: [flisk-release-published]
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: update-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.write.outputs.changed }}
      version: ${{ steps.write.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test workflow update contract
        run: node --test scripts/update-workflow.test.mjs
      - name: Write the manifest for the latest release
        id: write
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            version="$(bash scripts/update-manifest.sh "$RELEASE_TAG")"
          else
            version="$(bash scripts/update-manifest.sh)"
          fi
          cp bucket/flisk.json "$RUNNER_TEMP/flisk.json"
          bash scripts/update-manifest.sh "v$version" >/dev/null
          cmp --silent "$RUNNER_TEMP/flisk.json" bucket/flisk.json
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if git diff --quiet -- bucket/flisk.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest
          path: bucket/flisk.json
          if-no-files-found: error

  test:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifest
          path: bucket
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install Scoop
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
          Invoke-RestMethod get.scoop.sh -OutFile $installer
          & $installer -RunAsAdmin
          Join-Path $env:USERPROFILE 'scoop\shims' >> $env:GITHUB_PATH
      - name: Add this checkout as a bucket
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/flisk.json
          git commit -m "candidate" --allow-empty
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global --add safe.directory '*'
          # Scoop only accepts a Git URL, not a plain path.
          scoop bucket add flisk "file:///$($env:GITHUB_WORKSPACE -replace '\\', '/')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install
        run: |
          scoop install flisk/flisk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the installed CLI and find its engine
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          $output = flisk --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("$output" -notmatch [regex]::Escape($env:VERSION)) { throw "wrong version: $output" }
          Get-Command flisk | Format-List Source
          $project = Join-Path $env:RUNNER_TEMP 'flisk-project'
          New-Item -ItemType Directory -Path $project | Out-Null
          Set-Location $project
          flisk project --yes --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Copied from flisk-cli, which the binary finds next to its own path.
          if (-not (Test-Path 'shared-platform-engineering\docker-templates\install-deps.sh')) {
            throw 'the installed binary did not find flisk-cli'
          }

  publish:
    needs: [candidate, test]
    if: needs.candidate.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.SCOOP_BUCKET_AUTOMATION_TOKEN }}
      - name: Verify automation token
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set SCOOP_BUCKET_AUTOMATION_TOKEN with contents:write, pull-requests:write, and checks:read access to this repository"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifest
          path: bucket
      - name: Open and merge a pull request after required checks pass
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_AUTOMATION_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin automation/update-flisk-manifest || true
          git checkout -B automation/update-flisk-manifest
          git add bucket/flisk.json
          git commit -s -m "flisk $VERSION"
          git push --force-with-lease origin automation/update-flisk-manifest
          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$GITHUB_REPOSITORY_OWNER:automation/update-flisk-manifest" --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            body_file="$RUNNER_TEMP/pr-body.md"
            cat >"$body_file" <<'EOF'
          Fixes #2 and #6.

          Update the Scoop manifest to the latest tested Flisk release. GEL checks run on this pull request before it merges.
          EOF
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head automation/update-flisk-manifest --title "chore(scoop): update Flisk manifest to $VERSION" --body-file "$body_file")"
          fi
          gh pr checks --repo "$GITHUB_REPOSITORY" --required --watch "$pr_url"
          gh pr merge --repo "$GITHUB_REPOSITORY" --squash "$pr_url"
